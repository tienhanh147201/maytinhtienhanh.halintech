<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Tiến Hạnh - HaLin Tech | PC Gaming, Workstation & Linh Kiện</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        
        /* Top bar */
        .top-bar { background: #0a0a0a; color: #aaa; font-size: 13px; padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; flex-wrap: wrap; gap: 10px; }
        .top-bar span { display: flex; align-items: center; gap: 6px; }
        .top-bar a { color: #ff4d4d; font-weight: 600; }

        /* Navbar */
        header { background: #181818; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #282828; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-box { background: #e50914; color: #fff; font-weight: 800; padding: 6px 12px; border-radius: 6px; font-size: 18px; letter-spacing: 1px; }
        .logo-text { font-weight: 700; font-size: 16px; color: #fff; }
        .nav-links { display: flex; gap: 25px; list-style: none; align-items: center; }
        .nav-links a { font-size: 14px; font-weight: 500; color: #ccc; transition: 0.3s; }
        .nav-links a:hover { color: #ff4d4d; }
        .nav-cta { background: #e50914 !important; color: white !important; padding: 8px 16px; border-radius: 6px; font-weight: 600; }

        /* Hero Section */
        .hero { padding: 60px 5%; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; background: radial-gradient(circle at 10% 20%, #220808 0%, #121212 60%); }
        .badge { display: inline-block; background: rgba(229, 9, 20, 0.15); color: #ff4d4d; border: 1px solid rgba(229, 9, 20, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        .hero h1 { font-size: 42px; font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 20px; }
        .hero h1 span { color: #ff4d4d; }
        .hero p { font-size: 15px; color: #aaa; margin-bottom: 30px; }
        .hero-btns { display: flex; gap: 15px; margin-bottom: 40px; }
        .btn-primary { background: #e50914; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        .btn-primary:hover { background: #c50710; }
        .btn-outline { border: 1px solid #444; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        .btn-outline:hover { border-color: #ff4d4d; color: #ff4d4d; }
        .hero-stats { display: flex; gap: 40px; border-top: 1px solid #222; padding-top: 25px; }
        .stat-num { font-size: 22px; font-weight: 700; color: #fff; }
        .stat-desc { font-size: 13px; color: #888; }
        .hero-card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hero-card img { width: 100%; border-radius: 10px; display: block; margin-bottom: 15px; }
        .hero-card-price { background: #fff; color: #121212; padding: 15px; border-radius: 10px; font-weight: 700; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }

        /* Section Titles */
        .section-title { text-align: center; padding: 60px 0 40px; }
        .section-title span { color: #ff4d4d; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .section-title h2 { font-size: 32px; font-weight: 800; color: #fff; margin-top: 8px; }

        /* Categories Grid */
        .categories { padding: 0 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .cat-card { background: #181818; border: 1px solid #262626; border-radius: 12px; padding: 25px; transition: 0.3s; }
        .cat-card:hover { border-color: #ff4d4d; transform: translateY(-5px); }
        .cat-card h3 { font-size: 18px; color: #fff; margin-bottom: 8px; }
        .cat-card p { font-size: 13px; color: #999; }

        /* Products Grid */
        .products { padding: 0 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .prod-card { background: #1a1a1a; border: 1px solid #282828; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .prod-img { width: 100%; height: 200px; object-fit: cover; background: #222; }
        .prod-body { padding: 20px; }
        .prod-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 15px; }
        .spec-list { list-style: none; font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .spec-list li { margin-bottom: 6px; position: relative; padding-left: 15px; }
        .spec-list li::before { content: "•"; color: #ff4d4d; position: absolute; left: 0; }
        .prod-footer { padding: 15px 20px; background: #151515; border-top: 1px solid #252525; display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 20px; font-weight: 800; color: #ff4d4d; }
        .btn-buy { background: #e50914; color: white; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; }

        /* Why Choose Us */
        .features { padding: 0 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .feature-card { background: #181818; border: 1px solid #262626; padding: 30px; border-radius: 12px; }
        .feature-num { font-size: 28px; font-weight: 800; color: #333; margin-bottom: 10px; }
        .feature-card h3 { color: #fff; font-size: 16px; margin-bottom: 6px; }
        .feature-card p { font-size: 13px; color: #999; }

        /* Contact Section */
        .contact-section { padding: 60px 5%; background: #151515; margin-top: 60px; border-top: 1px solid #222; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .contact-info h2 { font-size: 28px; color: #fff; margin-bottom: 20px; }
        .info-item { margin-bottom: 15px; font-size: 14px; color: #ccc; }
        .info-item strong { color: #fff; display: block; margin-bottom: 3px; }
        .map-box { width: 100%; height: 300px; background: #222; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .map-box iframe { width: 100%; height: 100%; border: 0; }

        /* Floating buttons */
        .float-btns { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 999; }
        .float-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .zalo-btn { background: #0068ff; }
        .phone-btn { background: #e50914; }

        /* Footer */
        footer { background: #0d0d0d; padding: 30px 5%; text-align: center; font-size: 13px; color: #777; border-top: 1px solid #222; }

        @media (max-width: 768px) {
            .hero, .contact-section { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .hero h1 { font-size: 30px; }
        }
    </style>
</head>
<body>


    <!-- Floating Buttons -->
    <div class="float-btns">

        <a href="tel:0988373446" class="float-btn phone-btn" title="Gọi ngay">📞</a>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Máy Tính Tiến Hạnh - HaLin Tech. Hotline/Zalo: 0988 373 446</p>
    </footer>

</body>
</html>
